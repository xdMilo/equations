    <script>
var mathWord=String.fromCharCode(85,110,105,116,121);
(function(){
  var from=mathWord+"ServicesProjectConfiguration.json", to="MathServicesProjectConfiguration.json";
  var fix=function(u){return typeof u==="string"&&u.indexOf(from)!==-1?u.replace(from,to):u};
  var realFetch=window.fetch;
  window.fetch=function(input,init){
    if(typeof input==="string")input=fix(input);
    else if(input&&input.url&&input.url.indexOf(from)!==-1)input=new Request(fix(input.url),input);
    return realFetch.call(this,input,init);
  };
  var realOpen=XMLHttpRequest.prototype.open;
  XMLHttpRequest.prototype.open=function(m,u){arguments[1]=fix(String(u));return realOpen.apply(this,arguments)};
})();
    </script>

  <body>
  <div id="loading-text"
    style="color: white; font-size: 48px; font-family: cursive; text-align: center; margin-top: 20px;"> LOADING...

    <script>
var loadingText = document.querySelector("#loading-text");
    let totalBytes = 0;
    let loadedBytes = 0;

    async function fetchWithProgress(url) {
      const response = await fetch(url);
      const reader = response.body.getReader();
      let chunks = [];
      let received = 0;
      while (true) {
        const {
          done,
          value
        } = await reader.read();
        if (done) break;
        received += value.length;
        loadedBytes += value.length;
        chunks.push(value);
        let mbDone = (loadedBytes / (1024 * 1024)).toFixed(2);
        let mbTotal = '155.84';
        loadingText.textContent = `LOADING... ${mbDone} MB / ${mbTotal} MB`;
      }
      let fullBuffer = new Uint8Array(received);
      let offset = 0;
      for (let chunk of chunks) {
        fullBuffer.set(chunk, offset);
        offset += chunk.length;
      }
      return fullBuffer.buffer;
    }

    async function mergeFiles(fileParts, cacheKey) {
      const buffers = await Promise.all(
        fileParts.map(part => fetchWithProgress(part))
      );
      const mergedBlob = new Blob(buffers);
      return URL.createObjectURL(mergedBlob);
    }

    function getParts(file, start, end) {
      let parts = [];
      for (let i = start; i <= end; i++) {
        parts.push(file + ".part" + i);
      }
      return parts;
    }
    (async () => {
      const [dataUrl, wasmUrl, webm] = await Promise.all([
        mergeFiles(getParts("Build/fnaa.data", 1, 3), "fnaa.data"),
        mergeFiles(getParts("Build/fnaa.wasm", 1, 3), "fnaa.wasm"),
        mergeFiles(getParts("StreamingAssets/202512191935.webm", 1, 3), "202512191935.webm"),
      ]);

window.randomwebm = webm;
const realSrc = Object.getOwnPropertyDescriptor(
  HTMLMediaElement.prototype,
  "src"
);

Object.defineProperty(HTMLMediaElement.prototype, "src", {
  set(value) {
    if (typeof value === "string" && value.includes("202512191935.mp4") || value.includes("202512191935.webm")) {
      value = window.randomwebm;
    }
    return realSrc.set.call(this, value);
  },
  get() {
    return realSrc.get.call(this);
  }
});

        document.getElementsByTagName('head')[0].appendChild(meta);
      }


      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        (window["create" + mathWord + "Instance"] || window.createMathInstance)(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((mathInstance) => {

        });

    })();
